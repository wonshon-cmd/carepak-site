<script>
// Unknown address on start.carepakpharmacy.com.
// Known pages typed with different capitals, dashes or a missing slash go to the right page;
// anything else goes to the main site.
(function () {
  var p = location.pathname.toLowerCase().replace(/index\.html$/, '').replace(/[^a-z]/g, '');
  var map = { letstalk: '/letsconnect/', letsconnect: '/letsconnect/', letsgetconnected: '/letsconnect/', connect: '/letsconnect/',
              onboarding: '/onboarding/', onboard: '/onboarding/', admin: '/admin/' };

  else location.replace('https://www.carepakpharmacy.com/');
})();
</script></head><body><a href="https://www.carepakpharmacy.com/">Continue to Carepak Pharmacy</a></body></html>
